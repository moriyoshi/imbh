name: Release

# Release gate + CD (QUALITY_GATE.md §3–4). On a `v*` tag this runs the release-time legal checks and
# then produces everything users install:
#
#   meta      resolve the version / tag / image name once, so no job re-derives them
#   licenses  license compatibility (cargo-deny) + THIRD-PARTY-NOTICES.txt (cargo-about)
#   build     imbhd + imbh-tui, release profile, one leg per published target
#   publish   checksums + upload the archives into a DRAFT Release, then publish it
#   image     linux/amd64 + linux/arm64 manifest -> ghcr.io/<owner>/imbh
#
# `build` depends on `licenses` on purpose: the notices file it packages into every archive is the
# one generated in this run, and we do not hand out binaries whose license gate failed.
#
# `workflow_dispatch` is a rehearsal of the exact same path. With `dry_run` left at its default the
# archives and the multi-arch image are built and the archives kept as workflow artifacts, but
# nothing is uploaded to a Release and nothing is pushed to the registry — so the pipeline can be
# validated without cutting a release. Dispatching *from a tag* with `dry_run: false` re-publishes
# assets for an existing tag; dispatching from a branch never publishes (there is no version tag to
# attach to).
#
# The full Rust gate is NOT re-run here — ci.yml already ran it on the commit being tagged.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — do not upload Release assets or push the image'
        type: boolean
        default: true

# Never cancel a release mid-flight; a half-uploaded asset set is worse than a duplicate run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; each job widens only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            # Dispatched from a branch: name the artifacts after the version in the tree. Every crate
            # inherits `version.workspace`, so the first `version = ` in the root manifest
            # ([workspace.package]) is the one shared release version.
            version="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
            tag="v${version}"
          fi
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::could not resolve a semver version (got '${version}')"
            exit 1
          fi
          # A pre-release version (0.2.0-rc.1) must not move the floating `latest` / `X.Y` image tags.
          prerelease=false
          case "${version}" in *-*) prerelease=true ;; esac
          # Only a tag ref can publish, and only when this is not a dry run.
          publish=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${{ inputs.dry_run || false }}" != "true" ]; then
            publish=true
          fi
          # Registry paths must be lowercase; the repository slug usually already is.
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
            echo "image=${image}"
          } | tee -a "${GITHUB_OUTPUT}"

      # Fail in seconds rather than after five fat-LTO build legs. An already-published Release is
      # immutable and can never accept this run's archives, so there is nothing worth building — and
      # the tempting fix (delete it and re-tag) is the one move that cannot be undone. Says so here,
      # while the reader still has the choice.
      - name: Check the Release slot is still writable
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          draft="$(gh release view "${TAG}" --json isDraft --jq '.isDraft' 2> /dev/null || echo absent)"
          case "${draft}" in
            absent) echo "no Release exists for ${TAG} yet — the publish job will create a draft" ;;
            true)   echo "::notice::a draft Release already exists for ${TAG}; the publish job will fill and publish it" ;;
            *)      echo "::error::${TAG} already has a published (immutable) Release — it cannot accept new assets. Do NOT delete it to retry: GitHub keeps the tag name reserved permanently, even after deletion and even with immutability turned off. Release the next version instead."
                    exit 1 ;;
          esac

  licenses:
    name: License + notices
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-deny,cargo-about
      - name: License-compatibility gate
        run: ./scripts/license-gate.sh
      - name: Generate third-party notices
        run: ./scripts/gen-notices.sh
      # The checked-in copy is what crates.io users see; a diff means someone changed the shipped
      # dependency graph without re-running gen-notices.sh. Not fatal — cargo-about resolves some
      # licence text over the network, so byte-identical output is not guaranteed run to run — but it
      # should be visible in the run summary.
      - name: Flag drift against the checked-in notices
        shell: bash
        run: |
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.txt; then
            echo "::warning::THIRD-PARTY-NOTICES.txt differs from the checked-in copy — re-run ./scripts/gen-notices.sh and commit it"
            git diff --stat -- THIRD-PARTY-NOTICES.txt >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.txt
          # Every release archive and the image must carry this file (Apache-2.0 §4(d)), so its
          # absence is a release-blocking error, not a warning.
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [meta, licenses]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    # The release profile is opt-level="s" + fat LTO + codegen-units=1 (ARCHITECTURE.md §11), which
    # is deliberately slow. One slow leg must not abandon the others.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux legs build NATIVELY on 22.04 runners rather than cross-compiling: the only C
          # dependency in the graph is zstd-sys (vendored libzstd, built by cc via parquet), and a
          # native toolchain is the one configuration that needs no cross C setup at all. 22.04 and
          # not 24.04 because it pins the glibc floor at 2.35 — the release binaries then also run on
          # the debian:bookworm-slim base of docker/Dockerfile (glibc 2.36). arm64 GitHub-hosted
          # runners are free for public repositories.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            features: docker,grpc,tracing
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            features: docker,grpc,tracing
          # macOS omits `docker`: a logging-driver plugin is served over a Unix socket to a *local*
          # Docker daemon, and on macOS the daemon runs inside a VM, so the feature could not be used
          # even though it compiles. Dropping it keeps an unverifiable code path off the release path.
          # x86_64 is cross-compiled on the arm64 runner — Apple's clang is a native cross-compiler,
          # so zstd-sys builds with just `-arch x86_64`, and it avoids depending on an Intel runner
          # label that keeps being retired.
          - target: aarch64-apple-darwin
            runner: macos-latest
            features: grpc,tracing
          - target: x86_64-apple-darwin
            runner: macos-latest
            features: grpc,tracing
          # `docker` is Unix-only (`#[cfg(all(feature = "docker", unix))]`), so it would compile to
          # nothing here; leave it off rather than imply support.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            features: grpc,tracing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Registry only, NOT the target directories. Two reasons, and they point the same way:
      #
      # 1. A repository gets 10 GB of Actions cache, evicted LRU and shared with ci.yml. Five legs of
      #    fat-LTO release artifacts would be multiple GB and would evict the caches that make every
      #    PR fast — paying for a rare release by slowing down every push is the wrong trade.
      # 2. They would rarely hit anyway. GitHub scopes caches by ref: a run cannot restore a cache
      #    created for a *different tag name*, and it only falls back to the default branch's scope.
      #    This job never runs on main, so there is no main-scoped entry to fall back to, and the
      #    first run of each new tag — normally the only run — is cold no matter what is stored.
      #
      # The registry cache is small, does hit, and saves fetching a ~275-crate graph on five runners.
      # Note the corollary for rehearsals: a `workflow_dispatch` run FROM main writes into main's
      # scope, so doing the dry run there also warms the registry cache for the subsequent tag.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          # Quoted: Actions inputs are strings, and this is the form rust-cache documents.
          cache-targets: "false"
      # Overwrite the checked-in copy with the one just generated, so the archives carry notices that
      # match this build rather than whatever was last committed.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: third-party-notices

      - name: Build imbhd
        run: cargo build --release --locked --target ${{ matrix.target }} -p imbh-server --features ${{ matrix.features }}
      - name: Build imbh-tui
        run: cargo build --release --locked --target ${{ matrix.target }} -p imbh-tui

      # The glibc floor is not theoretical. Built on a 24.04 host (glibc 2.39), `imbh-tui` requires
      # GLIBC_2.39 while `imbhd` only requires 2.34 — so a 24.04 build would have produced an image
      # whose server worked and whose explorer died with "version `GLIBC_2.39' not found", in one
      # binary only. Assert the requirement instead of trusting the runner label: this catches both a
      # runner-image bump under us and a new dependency that reaches for a newer symbol.
      - name: Guard the glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # What docker/Dockerfile's debian:bookworm-slim base provides. Move the two together.
          max_allowed=2.36
          fail=0
          for b in imbhd imbh-tui; do
            # `|| true`: with `pipefail`, a no-match grep would abort the step via `set -e` instead of
            # reporting. An empty result is handled below rather than silently treated as "fine".
            need="$( { readelf --dyn-syms -W "target/${{ matrix.target }}/release/${b}" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1; } || true )"
            if [ -z "${need}" ]; then
              echo "::error::could not read any GLIBC_x.y symbol requirement from ${b} — the check is broken, not the binary"
              fail=1
              continue
            fi
            echo "${b}: highest required symbol version = glibc ${need} (limit ${max_allowed})"
            if [ "$(printf '%s\n%s\n' "${max_allowed}" "${need}" | sort -V | tail -1)" != "${max_allowed}" ]; then
              echo "::error::${b} requires glibc ${need}, newer than the ${max_allowed} of docker/Dockerfile's base image — it would not run in the published container"
              fail=1
            fi
          done
          [ "${fail}" -eq 0 ]

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          target="${{ matrix.target }}"
          name="imbh-${version}-${target}"
          stage="dist/${name}"
          exe=""
          [ "${RUNNER_OS}" = "Windows" ] && exe=".exe"

          mkdir -p "${stage}"
          cp "target/${target}/release/imbhd${exe}" "${stage}/"
          cp "target/${target}/release/imbh-tui${exe}" "${stage}/"
          cp LICENSE THIRD-PARTY-NOTICES.txt "${stage}/"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            asset="${name}.zip"
            ( cd dist && 7z a -tzip "${asset}" "${name}" > /dev/null )
          else
            asset="${name}.tar.gz"
            tar -C dist -czf "dist/${asset}" "${name}"
          fi

          # macOS has shasum, not sha256sum. Checksum the archive by bare basename so a downloader
          # can `sha256sum -c` it from whatever directory they saved it in.
          if command -v sha256sum > /dev/null 2>&1; then sha="sha256sum"; else sha="shasum -a 256"; fi
          ( cd dist && ${sha} "${asset}" > "${asset}.sha256" )

          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

          # Report the shipped binary sizes: the footprint budgets in OVERVIEW.md §2 are per-target
          # and, until now, only ever measured on the CI host. This is the first place real numbers
          # for every published target are visible.
          {
            echo "### ${target}"
            echo ''
            echo '| artifact | bytes | MiB |'
            echo '|---|---:|---:|'
            for f in "${stage}/imbhd${exe}" "${stage}/imbh-tui${exe}" "dist/${asset}"; do
              b=$(wc -c < "${f}" | tr -d ' ')
              printf '| `%s` | %s | %.1f |\n' "$(basename "${f}")" "${b}" "$(awk "BEGIN{print ${b}/1048576}")"
            done
            echo ''
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Smoke-test the built binaries
        # Only where the artifact runs on the runner that built it — the cross-compiled
        # x86_64-apple-darwin leg would need Rosetta, so it is verified by the Windows/arm legs'
        # equivalents plus ci.yml rather than here. Cheap, but it catches a broken link (a missing
        # shared library, a bad feature combination) before the binary reaches a Release page.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          stage="dist/imbh-${version}-${{ matrix.target }}"
          exe=""
          [ "${RUNNER_OS}" = "Windows" ] && exe=".exe"
          # A workspace-relative path on purpose: an absolute POSIX path from `mktemp -d` would be
          # subject to MSYS2's argument path translation when handed to a native Windows binary.
          rm -rf smoke-db
          db=smoke-db
          # imbhd has no --version flag; starting it with every listener disabled and no plugin socket
          # makes it initialise the database and then exit non-zero with "nothing to serve", which
          # proves the binary loads, links, and can open a DB. Assert on that message.
          out="$(IMBH_LISTEN_ADDR='' IMBH_GRPC_LISTEN_ADDR='' "${stage}/imbhd${exe}" "${db}" 2>&1 || true)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qi 'nothing to serve'
          # imbh-tui prints its usage and exits non-zero when given no database directory.
          out="$("${stage}/imbh-tui${exe}" 2>&1 || true)"
          printf '%s\n' "${out}"
          printf '%s' "${out}" | grep -qi 'imbh-tui'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish Release assets
    needs: [meta, build]
    runs-on: ubuntu-latest
    if: needs.meta.outputs.publish == 'true'
    permissions:
      # Creating the Release and uploading its assets.
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # One SHA256SUMS covering every archive, so `sha256sum -c SHA256SUMS` verifies the whole
          # release at once; the per-asset .sha256 files stay for people who grab a single archive.
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
      # Upload into a DRAFT and publish only once every asset has landed. This order is not a
      # nicety, it is the only order that works under GitHub's immutable releases: publishing
      # freezes a release, so a *published* one rejects every later asset upload ("Cannot upload
      # assets to an immutable release"), and the tag name is then burned FOREVER — deleting the
      # release to retry does not give it back, and neither does turning immutability off. A
      # create-then-upload sequence therefore does not merely fail, it destroys the version number.
      # A draft is exempt from all of that: it is mutable, re-runnable, and deletable.
      - name: Upload the archives into a draft Release, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out (it only needs the artifacts), so `gh` cannot infer the
          # repository from a git remote — name it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # `none` also covers a `gh` that cannot see the release at all; the create below is the
          # authority either way.
          state="$(gh release view "${TAG}" --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2> /dev/null || echo none)"
          case "${state}" in
            none)
              flags=(--draft --title "${TAG}" --generate-notes --verify-tag)
              [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
              if ! gh release create "${TAG}" "${flags[@]}"; then
                echo "::error::could not create a draft Release for ${TAG}. If the API said the tag name was used by an immutable release, that name is permanently reserved — it cannot be recovered by deleting anything or by disabling immutability. Bump to the next version and tag again."
                exit 1
              fi
              ;;
            draft)
              echo "::notice::reusing the existing draft Release for ${TAG}"
              ;;
            published)
              echo "::error::${TAG} is already published, so it is immutable and cannot accept these assets. Do NOT delete it to retry — that burns the tag name permanently. Release the next version instead."
              exit 1
              ;;
          esac
          # --clobber so a re-run replaces a partially uploaded asset set rather than failing. Safe
          # here precisely because the target is still a draft.
          gh release upload "${TAG}" dist/* --clobber
          # Everything is in place: freeze it. `--latest` is explicit so a prerelease never displaces
          # the current stable release on the repository front page.
          if [ "${PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --latest=false
          else
            gh release edit "${TAG}" --draft=false --latest=true
          fi
          gh release view "${TAG}" --json assets --jq '.assets[].name'

  image:
    name: Container image
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to GHCR.
      packages: write
    steps:
      # Only docker/Dockerfile is needed from the repository — the image compiles nothing, so there is
      # no toolchain and no source checkout here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docker
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: dist-*-unknown-linux-gnu
          merge-multiple: true
          path: archives

      # Deliberately inline rather than calling scripts/build-image.sh: this job should be readable
      # top to bottom, with no indirection into a script whose default mode is to compile the
      # workspace. docker/Dockerfile's header is the contract for the layout below; keep the two in
      # step (`./scripts/build-image.sh` stages the same shape for a local single-arch build).
      - name: Stage the build context
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          ctx=docker/ctx

          # docker/Dockerfile selects a binary with BuildKit's ${TARGETARCH}, so each architecture
          # goes to linux/<goarch>/. This goarch-to-Rust-triple mapping is CI's alone; keep it in step
          # with the Linux legs of the build matrix above and with `platforms:` below.
          for pair in 'amd64 x86_64-unknown-linux-gnu' 'arm64 aarch64-unknown-linux-gnu'; do
            arch="${pair%% *}"
            target="${pair##* }"
            mkdir -p "${ctx}/linux/${arch}"
            tar -xzf "archives/imbh-${version}-${target}.tar.gz" \
              -C "${ctx}/linux/${arch}" --strip-components=1
            chmod 0755 "${ctx}/linux/${arch}/imbhd" "${ctx}/linux/${arch}/imbh-tui"
          done

          # Both archives carry the same LICENSE + notices, and they are the copies this run's
          # `licenses` job generated -- so lifting them out of an archive is precisely what guarantees
          # the image and the downloadable archives carry identical attribution. Move rather than copy
          # so they do not linger beside the binaries.
          mv "${ctx}/linux/amd64/LICENSE" "${ctx}/LICENSE"
          mv "${ctx}/linux/amd64/THIRD-PARTY-NOTICES.txt" "${ctx}/THIRD-PARTY-NOTICES.txt"
          rm -f "${ctx}/linux/arm64/LICENSE" "${ctx}/linux/arm64/THIRD-PARTY-NOTICES.txt"

          find "${ctx}" -type f -printf '  %10s  %p\n'

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && needs.meta.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-,format=short
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/ctx
          file: docker/Dockerfile
          # No QEMU/binfmt setup anywhere in this job: docker/Dockerfile runs its only RUN step in a
          # stage pinned to $BUILDPLATFORM, and the per-arch stages just COPY prebuilt binaries.
          platforms: linux/amd64,linux/arm64
          # On a dry run this still builds both arches and discards them, which is the point —
          # the Dockerfile and the staging layout get validated without publishing.
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          annotations: ${{ steps.tags.outputs.annotations }}
          # Layer cache. Be clear about what this does and does not buy: the binary COPY layers change
          # on every build, so a *new* release never reuses them. It pays for re-runs of the same
          # commit — a transient GHCR push failure, or repeated `dry_run` rehearsals — where the whole
          # build becomes a cache hit. `mode=min` rather than `max` deliberately: the only extra thing
          # `max` would store is the `prep` stage's `useradd` layer, which is worth nothing, while the
          # store itself competes with the build job's Rust caches for the repository's 10 GB budget.
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # `mode=min` records the build inputs without embedding the full environment (which
          # `mode=max` does, and which can capture secrets).
          provenance: mode=min
