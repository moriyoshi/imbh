name: Release gate

# Release-time checks (QUALITY_GATE.md §3): license compatibility (cargo-deny) and third-party
# notice generation (cargo-about). Both tools are installed here so the graceful-skip fallbacks in
# the scripts do not trigger. Runs on version tags and on manual dispatch. The generated
# THIRD-PARTY-NOTICES.txt is uploaded as a build artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: License + notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-deny,cargo-about
      - name: License-compatibility gate
        run: ./scripts/license-gate.sh
      - name: Generate third-party notices
        run: ./scripts/gen-notices.sh
      - name: Upload notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.txt
          if-no-files-found: warn
