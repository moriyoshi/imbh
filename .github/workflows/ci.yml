name: CI

# The always-on gate (QUALITY_GATE.md §1–2): the Rust gate (fmt / clippy / build / test) plus the
# deterministic crash-injection E2E and the footprint gate. The default `cargo test --workspace`
# already includes the Layer-3 E2E suite (server HTTP wire, crash/recovery, malformed input,
# tri-signal lifecycle, exporter-through-SDK, example smoke, interleave stress) — see TESTING.md.
# The slow opt-in RSS soak runs in soak.yml; the full license + notices gate runs in release.yml on
# tags. The `licenses` job below also runs the license-compatibility check on default-branch pushes
# (not on PRs) for earlier feedback.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: Rust gate + E2E
    runs-on: ubuntu-latest
    # This job compiles the workspace four times over (default, `fault-injection`, `docker`,
    # `docker,docker-remap`) into a single `target/`, and the DataFusion + Tantivy + VRL debug
    # artifacts are large. On a stock `ubuntu-latest` that overran the disk and `rust-lld` died
    # with SIGBUS (mmap of the output file past ENOSPC) while linking the last feature set. Two
    # measures keep it inside the runner: reclaim the preinstalled toolchains below, and drop
    # full debuginfo here. `line-tables-only` keeps `RUST_BACKTRACE=1` frames attributable to a
    # file and line while shedding most of the object size. Scoped to this job so the footprint
    # gate keeps measuring the profiles the release actually ships.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nothing here needs .NET, Android, GHC, CodeQL, or the preloaded container images, and no
      # test shells out to a Docker daemon (the log-driver suites speak to a Unix socket and a
      # FIFO this process creates itself). Reclaiming them buys back roughly 25-30 GB.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (fault-injection feature)
        run: cargo clippy -p imbh --all-targets --features fault-injection -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test (workspace — unit + Layer-3 E2E)
        run: cargo test --workspace
      - name: Crash-injection E2E (deterministic mid-seal hazards)
        run: cargo test -p imbh --features fault-injection --test crash_points
      # The `docker` feature is off by default (footprint gate), so the workspace jobs above never
      # compile it. Lint and run its suites explicitly — including the Unix-socket + FIFO E2E.
      - name: Clippy (docker log-driver feature)
        run: cargo clippy -p imbh-server --all-targets --features docker -- -D warnings
      - name: Test (docker log-driver plugin)
        run: cargo test -p imbh-server --features docker
      # `docker-remap` adds the VRL remapper (and its dependency subtree) on top. Both feature sets
      # are lint-and-tested because they are genuinely different code paths: without it the driver
      # stores lines verbatim, and that no-remap behaviour has to keep working.
      - name: Clippy (docker log-driver + VRL remap)
        run: cargo clippy -p imbh-server --all-targets --features docker,docker-remap -- -D warnings
      - name: Test (docker log-driver + VRL remap)
        run: cargo test -p imbh-server --features docker,docker-remap
      # Reported unconditionally so that if the linker ever dies with SIGBUS again the log says
      # straight away whether the disk was the cause.
      - name: Report disk usage
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  feature-matrix:
    name: Feature matrix (producer / consumer)
    runs-on: ubuntu-latest
    # The M6c producer/consumer split (ARCHITECTURE.md §11). Feature unification means the default
    # `cargo build --workspace` compiles even if a role's own feature set is insufficient, so the
    # reduced-config builds are the real proof and must be built explicitly here. This is a build +
    # clippy + dependency-cut gate: a producer can't run query tests (and vice-versa), so functional
    # tests stay in the default `--workspace` job above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Producer: ingest-only. Must drop the entire query engine.
      - name: Build producer (--features ingest)
        run: cargo build -p imbh --no-default-features --features ingest
      - name: Clippy producer
        run: cargo clippy -p imbh --no-default-features --features ingest -- -D warnings
      - name: Assert producer dropped DataFusion + sqlparser + imbh-query + tantivy
        run: |
          if cargo tree -e no-dev -p imbh --no-default-features --features ingest \
              | grep -qiE 'datafusion|sqlparser|imbh-query|tantivy'; then
            echo "::error::producer (ingest-only) build still pulls the query engine — the M6c cut regressed"
            cargo tree -e no-dev -p imbh --no-default-features --features ingest | grep -iE 'datafusion|sqlparser|imbh-query|tantivy'
            exit 1
          fi
      # Consumer: query-only. Must drop the OTLP decode path.
      - name: Build consumer (--features query)
        run: cargo build -p imbh --no-default-features --features query
      - name: Clippy consumer
        run: cargo clippy -p imbh --no-default-features --features query -- -D warnings
      - name: Assert consumer dropped OTLP decode (imbh-otlp)
        run: |
          if cargo tree -e no-dev -p imbh --no-default-features --features query | grep -qi 'imbh-otlp'; then
            echo "::error::consumer (query-only) build still pulls imbh-otlp — the M6c cut regressed"
            exit 1
          fi
      # Storage-only: neither role (open/stats/compact/snapshot only).
      - name: Build storage-only (--no-default-features)
        run: cargo build -p imbh --no-default-features

  windows:
    name: Windows portability gate
    runs-on: windows-latest
    # Every other job here is ubuntu-latest, so a Unix-shaped call in the on-disk path can ship
    # unnoticed — issue #3 was exactly that (fsync of a directory handle, which Windows rejects), and
    # it broke *every* on-disk `Db::open`. Deliberately narrow rather than a second full gate: build
    # the workspace, then run the two suites that actually touch the filesystem — `imbh-storage`
    # (WAL segment create/rotate, manifest `CURRENT` swap, seal → rename) and the facade's
    # open → seal → reopen → compact lifecycle. Not a substitute for the ubuntu gate above.
    #
    # Both suites also cover the second Unix-shaped assumption found here: reclaiming segment files
    # that a reader still holds open or memory-mapped, during retention and compaction. POSIX unlinks
    # those unconditionally; Windows refuses to delete a file with a live mapping, which a Tantivy
    # searcher over a `.tidx` sidecar always has. Keep those tests on this leg.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --workspace
      - name: Test (imbh-storage — on-disk WAL / manifest / seal path)
        run: cargo test -p imbh-storage
      - name: Test (facade lifecycle — on-disk open, seal, reopen, compact)
        run: cargo test -p imbh --test lifecycle

  footprint:
    name: Footprint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Footprint gate (crate count + release imbhd size)
        run: ./scripts/footprint-gate.sh

  licenses:
    name: License gate
    runs-on: ubuntu-latest
    # Default-branch pushes only — skipped on PRs (release.yml also runs it, plus notices, on tags).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-deny
      - name: License-compatibility gate
        run: ./scripts/license-gate.sh
