[package]
name = "imbh-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Read-only terminal explorer for IMBH metrics, traces, and logs."

[dependencies]
# `attrstats` is the Overview's attribute measurement (`Db::attribute_stats`), named explicitly rather
# than inherited from imbh-head's copy of the dependency: a standalone `cargo check -p imbh-tui` must
# turn it on by itself.
imbh = { workspace = true, features = ["attrstats"] }
# `imbh-tui --mcp-stdio` serves the Model Context Protocol on stdin/stdout — the transport MCP
# clients "SHOULD support whenever possible", and the one an agent that spawns its own server
# speaks. The protocol, the tools, and the loop all live in imbh-mcp, shared with the HTTP endpoint
# `imbhd` serves (ARCHITECTURE.md §10.16.1); this binary only chooses the backend. Adds no crate to
# the graph: it is `imbh` plus serde_json and base64, both already compiled under DataFusion.
imbh-mcp.workspace = true
# The head API (ARCHITECTURE.md §10.19). Both halves: `exec` is what the local backend runs against an
# open `Db`, `client` is what the `--url` backend drives a running `imbhd` with — the same operations
# either side of one HTTP request, which is what makes the two modes answer identically.
imbh-head = { workspace = true, features = ["client", "exec"] }
imbh-lgtm = { workspace = true, features = ["source"] }
ratatui.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
# `net` is the head client's transport (reqwest, under imbh-head); the rest is the event loop.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net"] }
# Drives the mascot easter eggs' randomness (seeded per run for reproducible tests). imbh-tui is not
# part of the core library, so a small extra dependency here is acceptable.
rand = { version = "0.9", features = ["small_rng"] }

[dev-dependencies]
# OTLP fixture builders for the local-backend tests, which drive every screen against an in-process
# `Db` to hold the direct-query path (`imbh-tui <directory>`) intact.
imbh-test-support.workspace = true
# The Overview's attribute measurement covers *sealed segments*, so its tests need a database on disk
# rather than the in-memory one every other screen's tests use.
tempfile.workspace = true

[[bin]]
name = "imbh-tui"
