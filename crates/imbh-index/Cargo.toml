[package]
name = "imbh-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "imbh full-text/term search: Tantivy schema/build/search and the RowSelection bridge (ARCHITECTURE.md §8). The only crate that knows Tantivy."

[dependencies]
imbh-core.workspace = true
tantivy.workspace = true
# Optional self-observability facade (ARCHITECTURE.md §11), off by default.
tracing = { workspace = true, optional = true }

[features]
# Emit index build/search spans/events through the `tracing` facade (off by default — §11 footprint lever).
tracing = ["dep:tracing"]

[dev-dependencies]
tempfile.workspace = true
