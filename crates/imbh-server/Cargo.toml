[package]
name = "imbh-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "imbhd: the reference HTTP server wiring for imbh (ARCHITECTURE.md §10.16). An axum/hyper HTTP/1.1 server — one worked example of host wiring, not the product."

[[bin]]
name = "imbhd"
path = "src/main.rs"

[dependencies]
imbh.workspace = true
# The MCP server itself: protocol dispatch, the read-only tool surface, and the JSON serializers
# `POST /api/query` and `GET /stats` share with the `query_sql`/`db_stats` tools. This crate owns only
# the Streamable HTTP transport around it (`POST /mcp`); the stdio transport is hosted by `imbh-tui`
# (ARCHITECTURE.md §10.16.1). Adds no crate to the graph — it is imbh plus serde_json and base64,
# both already compiled under DataFusion.
imbh-mcp.workspace = true
# The head API (ARCHITECTURE.md §10.19): the DTOs and the one implementation of each operation over a
# `Db`. This crate contributes only the HTTP transport around it (`src/head.rs`) — the same functions
# back `imbh-tui`'s local backend, which is what makes a head's two modes answer identically. Only
# `exec` here: a daemon *serves* the head API, it does not drive one, so the crate's own HTTP client
# stays out of the shipping graph (the tests pull it in as a dev-dependency).
imbh-head = { workspace = true, features = ["exec"] }
# The head API's request/response derives. Already compiled in the default graph (tantivy, DataFusion,
# opentelemetry-proto), so this edge adds no crate.
serde.workspace = true
# One shared multi-threaded runtime drives the accept loop and every connection. `Db`'s futures do
# blocking parquet/tantivy I/O inside themselves (there is no `spawn_blocking` anywhere in the
# library), so a handler that called them on a runtime worker would park it — every `Db` call in
# `route` therefore goes through `tokio::task::spawn_blocking`, and the blocking pool is what bounds
# request concurrency. `net`/`time` are the listener and the deadlines.
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
] }
# The HTTP/1.1 stack (see the workspace manifest for the feature-trimming rationale). axum owns
# routing and extraction; hyper owns the connection, including the `header_read_timeout` that backs
# `IMBH_HEADER_TIMEOUT`; hyper-util adapts tokio's `TcpStream` and tracks connections for the drain.
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http-body.workspace = true
tower.workspace = true
# The MCP endpoint's wire format (ARCHITECTURE.md §10.16.1): JSON-RPC in, JSON-RPC out. Already
# compiled in the default graph — serde_json via arrow-json, under datafusion — so this edge adds
# **no crate** to `imbh-server`'s tree (measured 293 → 293) and none to the `imbh` facade the
# footprint gate counts, which it never reaches. (Base64 is `imbh-mcp`'s business now: the
# `=?base64?…?=` header sentinel is decoded inside the dispatch.)
serde_json.workspace = true
# gzip request bodies (`Content-Encoding: gzip`), which the OTel Collector's otlphttp exporter sends by
# default. Already in the default graph via parquet — no new crate.
flate2.workspace = true
# ── gRPC (optional, off by default) ──────────────────────────────────────────────────────
# OTLP/gRPC ingest for the reference server. All three deps are optional and pulled ONLY by the
# `grpc` feature, so the default build (the footprint gate) carries no tonic/hyper/h2 subtree.
# `server`/`router`/`codegen` are the minimal tonic features to run the generated collector services;
# no TLS, no client `channel`. opentelemetry-proto's `gen-tonic` turns on the tonic *service* codegen
# (the workspace default is `gen-tonic-messages`, messages only); prost re-encodes the decoded request
# back to bytes for the existing `Db::ingest_otlp_*` byte API.
tonic = { workspace = true, optional = true, features = [
    "server",
    "router",
    "codegen",
] }
# Shared by `grpc` (which additionally turns on `gen-tonic` for the collector *services*) and
# `docker` (messages only — it builds `ExportLogsServiceRequest` values by hand). Cargo unifies the
# features, so enabling both is the union, not a conflict.
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
# Optional self-observability (ARCHITECTURE.md §11). The stderr subscriber wiring lives in the imbh
# facade's `console` module (behind `imbh/tracing-console`, which owns the `tracing-subscriber` dep);
# `imbhd` just calls its one-liner. `tracing` here is for the binary's own banner events. Both are
# pulled only under the `tracing` feature, so the default footprint-gate build is unchanged (§12 keeps
# the subscriber out of the graph).
tracing = { workspace = true, optional = true }
# The remap engine for the Docker log driver, pulled only by `docker-remap`. See that feature for the
# measured crate/binary cost and the workspace manifest for the feature-trimming rationale (no
# network/env/system/crypto function groups).
vrl = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# Graceful shutdown: `SIGINT`/`SIGTERM` handling for `imbhd` (`src/shutdown.rs`). std cannot catch a
# signal, so `sigaction` + the self-pipe come from libc. Not optional — signal-driven shutdown is part
# of what the reference *binary* is, not a feature to opt into. Unix-only: on other targets the crate
# builds without it and `Shutdown::install_signal_handlers` reports `Unsupported`. Footprint-neutral:
# libc is already in the default graph via DataFusion, so this edge adds **no crate**
# (ARCHITECTURE.md §11).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Install imbh's stderr console subscriber (RUST_LOG-aware) and turn on imbh's instrumentation.
# Off by default so `cargo build -p imbh-server` (the footprint gate) stays at the measured crate count;
# enable with `cargo build -p imbh-server --features tracing`.
tracing = ["dep:tracing", "imbh/tracing", "imbh/tracing-console"]
# OTLP/gRPC ingest on a second port (default 127.0.0.1:4317), served by tonic alongside the axum
# HTTP/1.1 server. Off by default; enable with `cargo build -p imbh-server --features grpc`. Adds only
# tonic itself and h2 on top of the default graph — hyper, tower, and axum are already there for the
# HTTP listener, and the runtime features tonic needs (`rt-multi-thread`/`net`/`time`) are too.
grpc = [
    "dep:tonic",
    "dep:opentelemetry-proto",
    "opentelemetry-proto/gen-tonic",
    "dep:prost",
]
# Docker logging-driver plugin: serve the `docker.logdriver/1.0` plugin API on a Unix socket, read
# each container's log FIFO, and ingest the lines as OTLP logs (`docs/DOCKER_LOG_DRIVER.md`). Unix
# only — the module is `#[cfg(unix)]`, so enabling this on Windows compiles to nothing. Off by
# default so `cargo build -p imbh-server` (the footprint gate) stays at the measured crate count;
# enable with `cargo build -p imbh-server --features docker`. Adds **no new crate** to the graph:
# prost and opentelemetry-proto's message types are already in the default `imbh` tree via imbh-otlp.
docker = ["dep:opentelemetry-proto", "dep:prost"]
# VRL remapping for the Docker log driver (docs/DOCKER_LOG_DRIVER.md): every container line runs
# through a compiled Vector Remap Language program that maps the Docker log-driver data model onto the
# OTel logs data model, with a built-in script covering JSON, logfmt, klog/glog and key=value. Off by
# default; the published plugin and the Linux release binaries enable it explicitly.
#
# THE ONE FEATURE IN THIS WORKSPACE THAT ADDS CRATES ON PURPOSE — every other feature comment here
# ends in "adds no new crate", and this one cannot. Measured delta: see .agents/docs/JOURNAL.md.
# `scripts/footprint-gate.sh` does NOT see it: the gate counts `cargo tree -p imbh` (the facade —
# dependency direction is `imbh ← imbh-server`, so vrl never reaches it) and builds this crate with
# DEFAULT features. The gate therefore prints an informational, non-failing plugin-build size instead.
docker-remap = ["docker", "dep:vrl", "dep:chrono"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# The head API's *client*, so `tests/head_e2e.rs` can drive `imbhd` the way `imbh-tui --url` does and
# assert that a remote head sees exactly what a local one sees. The shipping build needs only `exec`
# (see the dependency above); this adds the other half for tests.
imbh-head = { workspace = true, features = ["client"] }
# The protocol tests build gzip and chunked request bodies by hand; a normal dependency is not in
# scope for an integration test.
flate2.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
tempfile.workspace = true
imbh-test-support.workspace = true
