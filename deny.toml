# cargo-deny configuration (ARCHITECTURE.md §11 dependency policy, OVERVIEW.md §13 M6).
#
# Run: cargo deny check
# Gates: license compatibility, duplicate-version creep, and (when online) advisories.

[graph]
# Vet the licenses of everything actually SHIPPED, not just the host's default-feature build. The
# release pipeline (.github/workflows/release.yml) builds `imbhd` + `imbh-tui` for the five targets
# below with the `grpc,tracing` (+ `docker` on Linux) feature set. With the previous host-only,
# `all-features = false` graph, the entire tonic/hyper/h2/tower subtree behind `grpc` and every
# target-specific dependency (windows-sys, core-foundation, ...) went unchecked — so the gate did
# not cover the binaries we hand to users. Mirrors about.toml's `targets`; keep the two in sync.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # Not a release-archive target, but still the documented footprint target (OVERVIEW.md §2) and
    # what the Docker log-driver plugin rootfs builds (crates/imbh-server/docker-plugin/Dockerfile).
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[licenses]
# imbh is Apache-2.0 (ARCHITECTURE.md §15 q3); the whole dependency ecosystem is permissive.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# ARCHITECTURE.md §11: keep duplicate versions from creeping in; forbid openssl anywhere.
multiple-versions = "warn"
wildcards = "deny"
# The dev-only `imbh-test-support` is intentionally an unversioned path dependency (publish = false;
# it is stripped from published dev-deps — see the workspace `[workspace.dependencies]` note), which
# cargo-deny would otherwise flag as a `*` wildcard. Allow wildcards ONLY for in-tree path deps; a
# wildcard on a crates.io dependency is still denied.
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[advisories]
# Requires the advisory DB (network). CI fetches it; local offline runs can skip this section.
yanked = "warn"
# Transitive-only advisories with no actionable fix on imbh's side. Review on each dependency bump.
ignore = [
    # `paste` (proc-macro) is unmaintained but not vulnerable. It is pulled transitively by the
    # arrow/datafusion stack (imbh-query/imbh-storage), with no maintained drop-in replacement; it
    # runs at build time only and ships no runtime code. Reassess when arrow/datafusion drop it.
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
