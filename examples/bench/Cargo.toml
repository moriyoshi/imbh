[package]
name = "bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # example crate, not published to crates.io
description = "Example: a lightweight ingest + query throughput/latency benchmark for imbh (no criterion, std timing only)."

# Keep this crate out of the cargo-release plan entirely. `publish = false` above already stops the
# crates.io upload, but a plan member still shows up in `cargo release`'s "Publishing ..." status
# line (cargo-release builds that message from every selected package, then filters by `publish`
# only when assembling the actual `cargo publish --package` args). The shared version bump still
# reaches this crate through `version.workspace = true`.
[package.metadata.release]
release = false

[dependencies]
imbh.workspace = true
# `tui-bench` measures the head operations a TUI screen actually drives (`exec::promql`,
# `exec::traceql`), not the facade calls underneath them — the per-request metric-catalog read and
# the TraceQL per-candidate fetch both live in this layer, so timing the facade would miss them.
# `exec` only; the HTTP client would pull reqwest for nothing.
imbh-head = { workspace = true, features = ["exec"] }
opentelemetry-proto.workspace = true
prost.workspace = true
tempfile.workspace = true
# Already in the graph via `imbh`; needed here only to drive the async `stream_with_stats` path,
# which is the sole public surface exposing whether the Tantivy RowSelection was actually applied.
tokio = { workspace = true, features = ["rt", "macros"] }
futures.workspace = true
