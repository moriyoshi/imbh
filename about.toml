# cargo-about configuration — third-party notice generation for the shipped imbhd binary.
#
# Run (networked env): ./scripts/gen-notices.sh   (wraps `cargo about generate`)
#
# The `accepted` list MUST mirror the `allow` list in deny.toml (repo root) so the license
# allowlist and the notice generator never drift. deny.toml gates compatibility at build time
# (`cargo deny check licenses`); this config drives the human-readable THIRD-PARTY-NOTICES.txt.
# Keep the two lists in sync whenever either changes.

# Accepted SPDX license identifiers — mirror of deny.toml [licenses].allow.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

# Every target we publish a binary for, so target-specific dependencies (windows-sys, ntapi,
# core-foundation, ...) get attributed too — a notices file generated only for Linux would ship
# incomplete inside the Windows and macOS release archives. Mirrors deny.toml's [graph].targets;
# keep the two in sync. The five release-archive targets come from
# .github/workflows/release.yml's build matrix; musl is kept because it is the documented footprint
# target (OVERVIEW.md §2) and what the Docker log-driver plugin rootfs builds.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Ignore workspace-private (publish = false) crates — first-party code is not a third-party notice.
# imbh's own crates are published, so this is a no-op guard for any future internal-only crate.
private = { ignore = true }

# Notices are generated in a networked env (see scripts/gen-notices.sh), so cargo-about resolves
# license text via clearlydefined.io and each crate's own LICENSE files — no offline fallback knob
# needed. (cargo-about 0.9 dropped the old boolean `no-clearly-defined` config key; pass `--offline`
# on the CLI if a fully local run is ever required.)
